# Nginx Subdomain Configuration for EchoReader AI (echoreader.ai.stream-in.app)

# Redirect all HTTP requests to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name echoreader.ai.stream-in.app api.echoreader.ai.stream-in.app;
    return 301 https://$host$request_uri;
}

# 1. Frontend Web App (Next.js client) Subdomain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name echoreader.ai.stream-in.app;

    # SSL Certificates (managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/echoreader.ai.stream-in.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echoreader.ai.stream-in.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Proxy to Next.js running on Port 3000
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Backend API Gateway Subdomain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.echoreader.ai.stream-in.app;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/api.echoreader.ai.stream-in.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.echoreader.ai.stream-in.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # File uploads size configurations (50MB)
    client_max_body_size 50M;

    # Proxy to Fastify Server running on Port 3001
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
